name: release-plugin

# Publishes one plugin's per-platform binaries when a tag is pushed.
#
# Tag shape: <kind>/<name>/vX.Y.Z  — connectors/sentry/v1.0.0, runtimes/paseo/v1.0.0.
# The kind prefix is not decoration: it is the directory the source lives in AND
# the prefix conductor's `use:` resolver prefix-matches when it resolves a bare
# name (`use: sentry` under connectors: -> connectors/sentry/*). A connector and
# a runtime of the same name therefore never collide, in this repo or in a
# release-tag list.
on:
  push:
    tags:
      - "connectors/*/v*"
      - "runtimes/*/v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conductor-plugins (the plugin sources)
        uses: actions/checkout@v4
        with:
          path: conductor-plugins

      - uses: actions/setup-go@v5
        with:
          go-version-file: conductor-plugins/go.mod

      - name: Resolve kind + name + version from tag
        id: ref
        working-directory: conductor-plugins
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"           # e.g. connectors/sentry/v1.0.0
          kind="${tag%%/*}"                  # connectors
          rest="${tag#*/}"                   # sentry/v1.0.0
          name="${rest%%/*}"                 # sentry
          ver="${rest#*/}"                   # v1.0.0
          case "$kind" in
            connectors|runtimes) ;;
            *) echo "::error::tag $tag: kind must be connectors or runtimes"; exit 1 ;;
          esac
          echo "kind=$kind"       >> "$GITHUB_OUTPUT"
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "component=$name"  >> "$GITHUB_OUTPUT"
          echo "version=$ver"     >> "$GITHUB_OUTPUT"
          if [ ! -d "$kind/$name" ]; then
            echo "::error::no plugin source at $kind/$name for tag $tag"
            exit 1
          fi

      - name: Verify the plugin uses no conductor internals
        working-directory: conductor-plugins
        run: |
          set -euo pipefail
          # A plugin is out-of-process, sandboxed, third-party-shaped code. If it
          # ever reaches into conductor's internals the extraction is a lie, so
          # fail the release rather than ship it.
          if go list -deps ./... | grep 'NodeSpy/conductor/internal'; then
            echo "::error::plugin sources depend on conductor internals"
            exit 1
          fi

      - name: Test
        working-directory: conductor-plugins
        run: go test ./...

      - name: Cross-build + checksum
        working-directory: conductor-plugins
        run: |
          set -euo pipefail
          comp="${{ steps.ref.outputs.name }}"
          pkg="./${{ steps.ref.outputs.kind }}/$comp"
          mkdir -p dist
          platforms="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for p in $platforms; do
            os="${p%/*}"; arch="${p#*/}"
            out="dist/conductor-${comp}_${os}_${arch}"
            [ "$os" = "windows" ] && out="$out.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$out" "$pkg"
          done
          ( cd dist && sha256sum * > checksums.txt )
          cat dist/checksums.txt

      - name: Publish release
        working-directory: conductor-plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${{ steps.ref.outputs.kind }}/${{ steps.ref.outputs.name }} ${{ steps.ref.outputs.version }}" \
            --notes "conductor ${{ steps.ref.outputs.name }} ${{ steps.ref.outputs.kind == 'runtimes' && 'runtime' || 'connector' }} plugin ${{ steps.ref.outputs.version }} — per-platform binaries + checksums. Install: add \`${{ steps.ref.outputs.kind }}: { ${{ steps.ref.outputs.name }}: { use: ${{ steps.ref.outputs.name }} } }\` to your config and run \`conductor init\`."
