name: release-plugin

# Publishes one plugin's per-platform binaries when a component tag is pushed.
# Tag shape: <component>/vX.Y.Z  (e.g. sentry/v1.0.0) — the same shape
# `conductor init` resolves for `source: github.com/NodeSpy/conductor-plugins//<component>`.
on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conductor-plugins
        uses: actions/checkout@v4
        with:
          path: conductor-plugins

      - name: Checkout conductor (plugin sources + SDK)
        uses: actions/checkout@v4
        with:
          repository: NodeSpy/conductor
          # Build against the conductor version this repo requires. Override by
          # pushing the tag from a branch that bumps the require + this ref.
          ref: ${{ vars.CONDUCTOR_REF || 'main' }}
          path: conductor

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolve component + version from tag
        id: ref
        run: |
          tag="${GITHUB_REF_NAME}"           # e.g. sentry/v1.0.0
          comp="${tag%%/*}"                  # sentry
          ver="${tag##*/}"                   # v1.0.0
          echo "component=$comp" >> "$GITHUB_OUTPUT"
          echo "version=$ver"   >> "$GITHUB_OUTPUT"
          if [ ! -d "conductor/plugins/conductor-$comp" ]; then
            echo "::error::no plugin source at conductor/plugins/conductor-$comp for tag $tag"
            exit 1
          fi

      - name: Cross-build + checksum
        working-directory: conductor-plugins
        run: |
          comp="${{ steps.ref.outputs.component }}"
          pkg="github.com/NodeSpy/conductor/plugins/conductor-$comp"
          mkdir -p dist
          # Build against the checked-out sibling conductor.
          go mod edit -replace github.com/NodeSpy/conductor=../conductor
          go mod tidy
          platforms="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for p in $platforms; do
            os="${p%/*}"; arch="${p#*/}"
            out="dist/conductor-${comp}_${os}_${arch}"
            [ "$os" = "windows" ] && out="$out.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$out" "$pkg"
          done
          ( cd dist && sha256sum * > checksums.txt )
          cat dist/checksums.txt

      - name: Publish release
        working-directory: conductor-plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${{ steps.ref.outputs.component }} ${{ steps.ref.outputs.version }}" \
            --notes "conductor ${{ steps.ref.outputs.component }} plugin ${{ steps.ref.outputs.version }} — per-platform binaries + checksums. Install: add \`plugins: { ${{ steps.ref.outputs.component }}: { source: github.com/NodeSpy/conductor-plugins//${{ steps.ref.outputs.component }}, kind: connector, version: \"${{ steps.ref.outputs.version }}\" } }\` and run \`conductor init\`."
